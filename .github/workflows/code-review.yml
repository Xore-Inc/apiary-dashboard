name: Automated review

# A model reviews every pull request against the repository's conventions
# (AGENTS.md) and leaves inline comments. Runs only when the repository
# has a CLAUDE_CODE_OAUTH_TOKEN (`claude setup-token`) or ANTHROPIC_API_KEY
# secret; without one it skips, green. Advisory: never a required check.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # Not for drafts, forks (no secrets) or Dependabot.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Is a model configured?
        id: key
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH$API_KEY" ]; then echo "present=true" >>"$GITHUB_OUTPUT"; else echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret: review skipped."; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        if: steps.key.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Read AGENTS.md and README.md first; they
            hold the project's conventions. Report only what matters:
            - correctness bugs, with the input that breaks;
            - security: session and authorization checks, same-origin rule,
              viewers strictly read-only, the backend's service token never
              leaving the server;
            - public-repository safety: no real hosts, domains, addresses or
              credentials (test data uses RFC 5737 and example.test; the
              live checks take the dashboard's URL from the environment);
            - missing tests or docs for changed behavior.
            Use inline comments for specific lines and one short summary
            comment. No praise, no style nits the linters already catch. If
            there is nothing worth fixing, say so in one line.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
