name: Container

# Builds the production image on every pull request and scans it; on main
# and on version tags it is also pushed to ghcr.io. Nothing deploys it:
# where and how it runs is the cutover's decision (docs/release-gates.md).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Registry names are lowercase.
  IMAGE: ghcr.io/xore-inc/apiary-dashboard

jobs:
  image:
    name: Build, scan and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      # Built once into the local daemon for the checks; the push below
      # reuses the same layers from the cache.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: apiary-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image boots, refuses an open configuration, and serves
        run: |
          if docker run --rm apiary-dashboard:ci >refusal.log 2>&1; then
            echo "::error::the image started without SERVICE_TOKEN"; exit 1
          fi
          grep -q E-SERVICE-TOKEN refusal.log
          if docker run --rm -e SERVICE_TOKEN=ci-token apiary-dashboard:ci >refusal.log 2>&1; then
            echo "::error::the image started without OIDC_ISSUER_URL"; exit 1
          fi
          grep -q E-OIDC-ISSUER refusal.log
          if docker run --rm -e SERVICE_TOKEN=ci-token -e EXPORT_TOKEN=ci-token apiary-dashboard:ci >refusal.log 2>&1; then
            echo "::error::the image started with EXPORT_TOKEN equal to SERVICE_TOKEN"; exit 1
          fi
          grep -q E-EXPORT-TOKEN refusal.log
          secrets="$(mktemp -d)"; chmod 755 "$secrets"
          printf 'ci-token\n' > "$secrets/service-token"; : > "$secrets/empty"
          chmod 644 "$secrets"/*
          if docker run --rm -e SERVICE_TOKEN=ci-token -e SERVICE_TOKEN_FILE=/run/secrets/service-token -v "$secrets:/run/secrets:ro" apiary-dashboard:ci >refusal.log 2>&1; then
            echo "::error::the image started with both SERVICE_TOKEN and SERVICE_TOKEN_FILE"; exit 1
          fi
          grep -q E-SERVICE-TOKEN refusal.log
          for f in empty missing; do
            if docker run --rm -e SERVICE_TOKEN_FILE=/run/secrets/$f -v "$secrets:/run/secrets:ro" apiary-dashboard:ci >refusal.log 2>&1; then
              echo "::error::the image started with an unusable SERVICE_TOKEN_FILE ($f)"; exit 1
            fi
            grep -q E-SERVICE-TOKEN refusal.log
          done
          docker run -d --name dash-file -e SERVICE_TOKEN_FILE=/run/secrets/service-token -v "$secrets:/run/secrets:ro" -e OIDC_ISSUER_URL=https://sso.invalid/realms/ci -p 3001:3000 apiary-dashboard:ci
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3001/healthz && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/healthz)" = 200
          docker rm -f dash-file
          docker run -d --name dash -p 3000:3000 -e SERVICE_TOKEN=ci-token -e OIDC_ISSUER_URL=https://sso.invalid/realms/ci apiary-dashboard:ci
          for _ in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3000/healthz && break; sleep 0.5; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 307
          docker rm -f dash
      - name: Vulnerability scan (critical, fixable)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: apiary-dashboard:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: push
        if: github.event_name != 'pull_request'
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # An SBOM and SLSA provenance travel with the image.
          sbom: true
          provenance: mode=max
      # A signed build-provenance attestation: `gh attestation verify
      # oci://ghcr.io/xore-inc/apiary-dashboard:<tag> --owner Xore-Inc`.
      - uses: actions/attest-build-provenance@v4
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
