name: CI

# Every pull request and every push to main: the fast gates in one job, and
# the release gate's server half in another (scripts/server-checks.sh: the
# production build's boot refusals and its answers with no backend). The
# page, browser and authorization checks need real data and a session: they
# run against production before and after every release (e2e/live/,
# docs/release-gates.md), not here. GitHub-hosted runners only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUN_VERSION: "1.4.5"

jobs:
  public-safety:
    name: Public repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun scripts/check-public-leaks.ts

  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # TanStack moves fast and its packages must move together: exact
      # versions only, never a range or `latest` (APIARY #2180).
      - name: TanStack dependencies are pinned exactly
        run: |
          loose="$(jq -r '((.dependencies // {}) + (.devDependencies // {}))
              | to_entries[]
              | select(.key | startswith("@tanstack/"))
              | select(.value | test("^[0-9]+\\.[0-9]+\\.[0-9]+$") | not)
              | "\(.key) \(.value)"' package.json)"
          if [ -n "$loose" ]; then
            echo "::error::@tanstack dependencies must be pinned to an exact version:"
            echo "$loose"
            exit 1
          fi
      - run: bunx tsc --noEmit
      - run: bun run lint
      - run: bun run test
      - name: Theme outputs match their source
        run: scripts/theme-check-ci.sh
      - name: Generated server-function facade is current
        run: bun scripts/gen-queries.ts --check
      - run: bun run build
      - name: Generated route tree is current
        run: git diff --exit-code -- src/routeTree.gen.ts

  # The job keeps its name: the main-branch ruleset requires this check.
  smoke:
    name: Release gate (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Production server checks (no backend, no session)
        run: scripts/server-checks.sh

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
