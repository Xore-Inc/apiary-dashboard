# apiary-dashboard — the standalone dashboard as its own Arcane project
# (docs/cutover-plan.md, section 1.1). Arcane syncs this directory alone, so
# only deployment files are materialized under /var/dockge/stacks/apiary-dashboard/.
#
# Runs beside the old honeypot-dashboard project, not instead of it: this
# project binds only the staging port 19092, the old one keeps 19090, so
# production cutover and rollback are a Traefik route edit each. The two
# share nothing but the `honeynet` network and the BFF log directory —
# sessions live in this project's own Valkey and do not carry over.
#
# Every required value fails closed at interpolation (`:?`), so a sync
# without the host-local .env deploys nothing.
name: apiary-dashboard
x-runtime-defaults: &runtime-defaults
  logging:
    driver: json-file
    options:
      max-size: '25m'
      max-file: '3'
services:
  # Same image, flags and limits as honeypot-dashboard's oidc-sessions:
  # memory-only, nothing persisted, reachable only on the internal network.
  oidc-sessions:
    <<: *runtime-defaults
    image: valkey/valkey:9.1.2-alpine3.24@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    container_name: hp-apiary-dashboard-oidc-sessions
    restart: unless-stopped
    command:
      [
        'valkey-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    networks: [oidc-session]
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    labels:
      - autoheal=true
    read_only: true
    tmpfs: ['/data:size=16m,mode=0700']
    security_opt: [no-new-privileges:true]
    # The entrypoint chowns /data as root before dropping to its own user.
    cap_drop: [ALL]
    cap_add: [CHOWN, SETUID, SETGID]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 320M }

  dashboard:
    <<: *runtime-defaults
    # Release tag for reading, digest so a moved tag cannot change what runs.
    image: ghcr.io/xore/apiary-dashboard:${APIARY_DASHBOARD_VERSION:?set APIARY_DASHBOARD_VERSION}@${APIARY_DASHBOARD_DIGEST:?set APIARY_DASHBOARD_DIGEST}
    container_name: hp-apiary-dashboard
    restart: unless-stopped
    depends_on:
      oidc-sessions:
        condition: service_healthy
    environment:
      - PORT=3000
      - BACKEND_URL=http://backend-service:8081
      - BACKEND_MOUNTED_URL=http://backend-service-mounted:8082
      # The dashboard also reads SERVICE_TOKEN_FILE / EXPORT_TOKEN_FILE (a
      # secret file, exactly one of file or value); this stack uses the value.
      - SERVICE_TOKEN=${SERVICE_TOKEN:?set SERVICE_TOKEN}
      # Export-only credential for the VPS blocklist job; empty leaves machine
      # access to /export/portbridge-manual-blackhole.txt off.
      - EXPORT_TOKEN=${EXPORT_TOKEN:-}
      # Signs the operator behind each backend call (x-actor-assertion). Set
      # to the key file under the secrets mount, e.g.
      # /run/dashboard-secrets/actor-assertion.key; empty signs nothing.
      - ACTOR_ASSERTION_PRIVATE_KEY_FILE=${ACTOR_ASSERTION_PRIVATE_KEY_FILE:-}
      - OIDC_ISSUER_URL=${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET_FILE=/run/dashboard-secrets/oidc-client-secret
      - OIDC_SESSION_REDIS_URL=redis://oidc-sessions:6379/0
      - EXTERNAL_URL=${EXTERNAL_URL:?set EXTERNAL_URL}
      # rewrite.jsonl, not app.jsonl: the old dashboard still writes and
      # rotates app.jsonl in the same directory during the overlap.
      - DASHBOARD_BFF_LOG_FILE=/logs/dashboard-bff/rewrite.jsonl
      - HONEYPOT_DOMAIN=${HONEYPOT_DOMAIN:-}
      - KIBANA_PUBLIC_URL=${KIBANA_PUBLIC_URL:-}
      - EVEBOX_PUBLIC_URL=${EVEBOX_PUBLIC_URL:-}
      - ARKIME_PUBLIC_URL=${ARKIME_PUBLIC_URL:-}
      - BACKEND_TIMEOUT_MS=${BACKEND_TIMEOUT_MS:-}
      - BACKEND_MAX_INFLIGHT=${BACKEND_MAX_INFLIGHT:-}
      - BACKEND_MAX_QUEUE=${BACKEND_MAX_QUEUE:-}
      - LIVE_MAX_STREAMS=${LIVE_MAX_STREAMS:-}
      - BFF_EVENT_LOOP_SHED_MS=${BFF_EVENT_LOOP_SHED_MS:-}
      - TZ=Europe/Berlin
    # Staging port only. 19090 stays with honeypot-dashboard until the
    # seven-day rollback window closes. HP_BIND has a loopback default, not
    # :?, because Arcane validates this file before the host .env exists and
    # substitutes a placeholder for unset required values, which is no IP.
    # Unset therefore binds where the VPS bridge cannot reach: unexposed.
    ports:
      - '${HP_BIND:-127.0.0.1}:19092:3000'
    volumes:
      - ${DASHBOARD_SECRETS_DIR:-/var/dockge/stacks/apiary-dashboard/secrets}:/run/dashboard-secrets:ro
      # Read-write: the image runs as bun (uid 1000), the owner
      # honeypot-init's log-init step already gives this directory.
      - /opt/stacks/apiary/logs/dashboard-bff:/logs/dashboard-bff
    # The secret is readable by deploy-runner's group only. Its GID differs
    # per host build, so it comes from the host-local .env, never a default.
    group_add:
      - '${DEPLOY_RUNNER_GID:?set DEPLOY_RUNNER_GID}'
    networks:
      - honeynet
      - oidc-session
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Health check is baked into the image (Dockerfile HEALTHCHECK on /healthz).
    labels:
      - autoheal=true
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1G }

networks:
  oidc-session:
    internal: true
  # Shared with the backend stacks: explicit fixed name, non-external, the
  # same declaration every APIARY stack uses.
  honeynet:
    name: honeynet
    driver: bridge
